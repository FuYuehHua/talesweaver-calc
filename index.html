<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天翼之鍊換算器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 420px; margin: 0 auto; }
        h2 { margin-top: 0; color: #333; font-size: 1.5em; display: flex; align-items: center; gap: 8px; }
        .note-badge { background-color: #fff2cc; color: #b78103; font-size: 0.85em; padding: 4px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 15px; display: inline-block; border: 1px solid #ffe599; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #444; font-size: 0.95em; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
        input:focus { border-color: #1a73e8; outline: none; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
        .result-box { margin-top: 20px; padding: 15px; background: #e7f3ff; border-radius: 8px; border-left: 4px solid #1a73e8; }
        .total-price { color: #2c3e50; font-size: 1.05em; margin-bottom: 5px; }
        .om-title { font-weight: bold; color: #333; margin-top: 10px; font-size: 1em; }
        .om-price { color: #d93025; font-size: 1.8em; font-weight: bold; margin-top: 5px; margin-bottom: 10px; }
        .copy-btn { background-color: #1a73e8; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 0.95em; transition: background 0.2s; }
        .copy-btn:hover { background-color: #1557b0; }
    </style>
</head>
<body>

<div class="card">
    <h2>💰 天翼之鍊換算器</h2>
    <div class="note-badge">📌 目前比例 1 : 1612萬9千</div>
    
    <div class="input-group">
        <label>SEED 單價</label>
        <input type="number" id="price" placeholder="例如: 30000000" oninput="calculate()">
    </div>
    
    <div class="input-group">
        <label>數量</label>
        <input type="number" id="amount" placeholder="例如: 334" oninput="calculate()">
    </div>

    <div class="result-box">
        <div class="total-price">總價 (SEED): <span id="totalSeed">0</span></div>
        <div class="total-price" style="font-size: 0.85em; color: #666;">(對應試算表中的 U 欄位)</div>
        <hr style="border: 0; border-top: 1px solid #ced4da; margin: 12px 0;">
        <div class="om-title">換算 OM 價格 (V 欄位):</div>
        <div class="om-price" id="resultOM">0</div>
        <button class="copy-btn" onclick="copyResult()">📋 複製 OM 價格</button>
    </div>
</div>

<script>
    function calculate() {
        const price = document.getElementById('price').value || 0;
        const amount = document.getElementById('amount').value || 0;
        
        // 總價 = 單價 * 數量
        const total = price * amount;
        document.getElementById('totalSeed').innerText = total.toLocaleString();
        
        // 新公式：換算價格 = 總價 / 16,129,000 * 5
        const omResult = (total / 16129000) * 5;
        
        // 四捨五入到整數顯示
        document.getElementById('resultOM').innerText = Math.round(omResult).toLocaleString();
    }

    function copyResult() {
        const text = document.getElementById('resultOM').innerText;
        if (text === "0") {
            alert('目前金額為 0，請先輸入單價與數量！');
            return;
        }
        navigator.clipboard.writeText(text.replace(/,/g, '')).then(() => {
            alert('已成功複製 OM 價格: ' + text);
        }).catch(err => {
            alert('複製失敗，請手動選取複製。');
        });
    }
</script>

</body>
</html>
