<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天翼之鍊幣值換算器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 420px; margin: 0 auto; }
        h2 { margin-top: 0; color: #333; font-size: 1.5em; display: flex; align-items: center; gap: 8px; }
        .note-badge { background-color: #fff2cc; color: #b78103; font-size: 0.85em; padding: 4px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 15px; display: inline-block; border: 1px solid #ffe599; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #444; font-size: 0.95em; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
        input:focus { border-color: #1a73e8; outline: none; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
        .hint { font-size: 0.8em; color: #888; margin-top: 4px; }
        .result-box { margin-top: 20px; padding: 15px; background: #e7f3ff; border-radius: 8px; border-left: 4px solid #1a73e8; }
        .total-price { color: #2c3e50; font-size: 1.05em; font-weight: 500; }
        .result-title { font-weight: bold; color: #333; margin-top: 10px; font-size: 0.95em; }
        .om-price { color: #d93025; font-size: 1.8em; font-weight: bold; margin: 3px 0 10px 0; }
        .twd-price { color: #137333; font-size: 1.5em; font-weight: bold; margin: 3px 0 12px 0; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .copy-btn { background-color: #1a73e8; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9em; flex: 1; transition: background 0.2s; }
        .copy-btn:hover { background-color: #1557b0; }
        .copy-btn.secondary { background-color: #34a853; }
        .copy-btn.secondary:hover { background-color: #2d8e47; }
    </style>
</head>
<body>

<div class="card">
    <h2>💰 天翼之鍊幣值換算器</h2>
    <div class="note-badge">📌 目前比例 1 : 2000萬</div>
    
    <div class="input-group">
        <label>SEED 單價（單位：億）</label>
        <input type="number" id="priceYi" step="any" placeholder="例如：25 (代表25億) 或 0.3 (代表3千萬)" oninput="calculate()">
        <div class="hint">💡 可輸入小數，例如 1.5 代表 1 億 5,000 萬</div>
    </div>
    
    <div class="input-group">
        <label>數量</label>
        <input type="number" id="amount" placeholder="例如: 1 或 334" oninput="calculate()">
    </div>

    <div class="result-box">
        <div class="total-price">總價 (SEED): <span id="totalSeed">0</span></div>
        <hr style="border: 0; border-top: 1px solid #ced4da; margin: 12px 0;">
        
        <div class="result-title">換算 OM 價格:</div>
        <div class="om-price" id="resultOM">0</div>

        <div class="result-title">換算約當台幣 (TWD):</div>
        <div class="twd-price" id="resultTWD">0 元</div>
        
        <div class="btn-group">
            <button class="copy-btn" onclick="copyValue('resultOM', 'OM 價格')">📋 複製 OM</button>
            <button class="copy-btn secondary" onclick="copyValue('resultTWD', '台幣金額')">📋 複製台幣</button>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const priceYi = parseFloat(document.getElementById('priceYi').value) || 0;
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        
        // 1 億 = 100,000,000 SEED
        const actualPrice = priceYi * 100000000;
        const total = actualPrice * amount;
        
        document.getElementById('totalSeed').innerText = total.toLocaleString();
        
        // 換算基準：20,000,000 SEED = 1 台幣
        const twdResult = total / 20000000;
        // OM 價格 = (總價 / 20,000,000) * 5
        const omResult = twdResult * 5;
        
        document.getElementById('resultOM').innerText = Math.round(omResult).toLocaleString();
        document.getElementById('resultTWD').innerText = (twdResult % 1 === 0 ? twdResult.toLocaleString() : twdResult.toFixed(1).toLocaleString()) + " 元";
    }

    function copyValue(elementId, labelName) {
        const text = document.getElementById(elementId).innerText.replace(/[^0-9.]/g, '');
        if (!text || text === "0") {
            alert('目前金額為 0，請先輸入單價與數量！');
            return;
        }
        navigator.clipboard.writeText(text).then(() => {
            alert('已成功複製 ' + labelName + ': ' + text);
        }).catch(() => {
            alert('複製失敗，請手動選取。');
        });
    }
</script>

</body>
</html>
